version: '3.8'

# 档期预约平台全量中间件
# 启动：docker compose up -d
# 停止：docker compose down
# 查看日志：docker compose logs -f <service>

services:

  # ── MySQL 8.0 ────────────────────────────────────────────────
  # Canal 伪装成 MySQL 从库（Slave），通过主从复制协议拉取 binlog，MySQL 侧需要以下前提配置：
  #
  #   --log-bin=mysql-bin
  #     开启 binlog，文件名前缀为 mysql-bin（如 mysql-bin.000001）。
  #     MySQL 8.0 官方镜像默认开启，但 Docker 镜像未必，显式声明更保险。
  #
  #   --binlog-format=ROW
  #     必须是 ROW 格式。ROW 格式记录每行数据的完整前镜像 + 后镜像，
  #     Canal 可以精确知道哪条记录从什么值变成了什么值。
  #     STATEMENT 格式只记 SQL 语句（如 "UPDATE merchant SET ..."），
  #     无法从中提取具体行数据，Canal 无法解析。
  #     MySQL 8.0 默认已是 ROW 格式，同样显式声明，意图清晰。
  #
  #   --server-id=1
  #     MySQL 复制协议要求主库有全局唯一的非零 server-id。
  #     server-id=0 是 MySQL 的保留值，含义是"不参与复制拓扑"：
  #     Canal 注册从库时发送 COM_REGISTER_SLAVE 握手包，MySQL 检测到 server-id=0 会直接拒绝。
  #     MySQL 8.0 默认 server-id=0，因此这一项必须显式设置为非零值。
  #
  #   --binlog-do-db=mhp
  #     只为 mhp 库记录 binlog，过滤掉其他库（如 xxl_job）的变更，减少磁盘占用。
  mysql:
    image: mysql:8.0
    container_name: mhp-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 222333dyh
      MYSQL_DATABASE: mhp
      TZ: Asia/Shanghai
    command:
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --server-id=1
      - --binlog-do-db=mhp
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p222333dyh"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis 7 ───────────────────────────────────────────────────
  redis:
    image: redis:7
    container_name: mhp-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── RabbitMQ（含管理台） ───────────────────────────────────────
  # 管理台：http://localhost:15672  admin/123456
  rabbitmq:
    image: rabbitmq:3-management
    container_name: mhp-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: "123456"
    ports:
      - "5672:5672"
      - "15672:15672"

  # ── Nacos 2.3（单机模式，内置存储） ──────────────────────────────
  # 控制台：http://localhost:8848/nacos  nacos/nacos
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: mhp-nacos
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
    ports:
      - "8848:8848"
      - "9848:9848"
    volumes:
      - nacos-data:/home/nacos/data

  # ── XXL-Job Admin ─────────────────────────────────────────────
  # 控制台：http://localhost:8088/xxl-job-admin  admin/123456
  xxl-job-admin:
    image: xuxueli/xxl-job-admin:2.4.0
    container_name: mhp-xxl-job
    environment:
      PARAMS: >-
        --spring.datasource.url=jdbc:mysql://mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
        --spring.datasource.username=root
        --spring.datasource.password=222333dyh
        --xxl.job.accessToken=default_token
    ports:
      - "8088:8080"
    depends_on:
      mysql:
        condition: service_healthy

  # ── Elasticsearch 8.13（含 IK 分词器） ────────────────────────
  # 安全认证已关闭，开发环境无需密码
  # 构建：docker compose build elasticsearch（首次或 Dockerfile.es 变更时）
  elasticsearch:
    build:
      context: .
      dockerfile: Dockerfile.es
    container_name: mhp-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - TZ=Asia/Shanghai
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\\|yellow\"'"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ── Kibana 8.13（ES 可视化） ────────────────────────────────────
  # 控制台：http://localhost:5601
  # 用途：查看 merchant index、测试 IK 分词、调试 DSL 查询
  kibana:
    image: kibana:8.13.0
    container_name: mhp-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - TZ=Asia/Shanghai
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  # ── Canal Server 1.1.7 ────────────────────────────────────────
  # Canal 监听 MySQL binlog，mhp-account 内的 CanalSyncService 从 Canal 拉取变更同步到 ES
  # canal.instance.filter.regex：只监听 mhp 库的 merchant 和 user 两张表
  canal-server:
    image: canal/canal-server:v1.1.7
    container_name: mhp-canal
    environment:
      canal.instance.master.address: mysql:3306
      canal.instance.dbUsername: root
      canal.instance.dbPassword: 222333dyh
      canal.instance.filter.regex: "mhp\\.merchant,mhp\\.user"
      canal.destinations: example
    ports:
      - "11111:11111"
    depends_on:
      mysql:
        condition: service_healthy

  # ── AI Agent 服务（Python FastAPI + LangChain + DeepSeek）─────
  # 访问：http://localhost:8084
  # 环境变量 DEEPSEEK_API_KEY 通过 .env 文件注入（复制 mhp-ai/.env.example 为 mhp-ai/.env）
  mhp-ai:
    build:
      context: ./mhp-ai
      dockerfile: Dockerfile
    container_name: mhp-ai
    ports:
      - "8084:8084"
    environment:
      - TZ=Asia/Shanghai
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      # host.docker.internal 指向宿主机，让容器内的 Python 能访问宿主机上的 Java 服务
      - GATEWAY_URL=http://host.docker.internal:80
      - ACCOUNT_URL=http://host.docker.internal:8081
      - REDIS_URL=redis://redis:6379
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  nacos-data:
  es-data:
