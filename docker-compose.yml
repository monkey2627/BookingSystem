version: '3.8'

# 档期预约平台全量中间件
# 启动：docker compose up -d
# 停止：docker compose down
# 查看日志：docker compose logs -f <service>

services:

  # ── MySQL 8.0 ────────────────────────────────────────────────
  # 开启 ROW 格式 binlog，Canal 依赖此配置监听数据变更
  mysql:
    image: mysql:8.0
    container_name: mhp-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 222333dyh
      MYSQL_DATABASE: mhp
      TZ: Asia/Shanghai
    command:
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --server-id=1
      - --binlog-do-db=mhp
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p222333dyh"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis 7 ───────────────────────────────────────────────────
  redis:
    image: redis:7
    container_name: mhp-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  # ── RabbitMQ（含管理台） ───────────────────────────────────────
  # 管理台：http://localhost:15672  admin/123456
  rabbitmq:
    image: rabbitmq:3-management
    container_name: mhp-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: "123456"
    ports:
      - "5672:5672"
      - "15672:15672"

  # ── Nacos 2.3（单机模式，内置存储） ──────────────────────────────
  # 控制台：http://localhost:8848/nacos  nacos/nacos
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: mhp-nacos
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
    ports:
      - "8848:8848"
      - "9848:9848"
    volumes:
      - nacos-data:/home/nacos/data

  # ── XXL-Job Admin ─────────────────────────────────────────────
  # 控制台：http://localhost:8088/xxl-job-admin  admin/123456
  xxl-job-admin:
    image: xuxueli/xxl-job-admin:2.4.0
    container_name: mhp-xxl-job
    environment:
      PARAMS: >-
        --spring.datasource.url=jdbc:mysql://mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
        --spring.datasource.username=root
        --spring.datasource.password=222333dyh
        --xxl.job.accessToken=default_token
    ports:
      - "8088:8080"
    depends_on:
      mysql:
        condition: service_healthy

  # ── Elasticsearch 8.13（含 IK 分词器） ────────────────────────
  # 安全认证已关闭，开发环境无需密码
  # 构建：docker compose build elasticsearch（首次或 Dockerfile.es 变更时）
  elasticsearch:
    build:
      context: .
      dockerfile: Dockerfile.es
    container_name: mhp-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - TZ=Asia/Shanghai
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\\|yellow\"'"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ── Kibana 8.13（ES 可视化） ────────────────────────────────────
  # 控制台：http://localhost:5601
  # 用途：查看 merchant index、测试 IK 分词、调试 DSL 查询
  kibana:
    image: kibana:8.13.0
    container_name: mhp-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - TZ=Asia/Shanghai
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  # ── Canal Server 1.1.7 ────────────────────────────────────────
  # Canal 监听 MySQL binlog，mhp-account 内的 CanalSyncService 从 Canal 拉取变更同步到 ES
  # canal.instance.filter.regex：只监听 mhp 库的 merchant 和 user 两张表
  canal-server:
    image: canal/canal-server:v1.1.7
    container_name: mhp-canal
    environment:
      canal.instance.master.address: mysql:3306
      canal.instance.dbUsername: root
      canal.instance.dbPassword: 222333dyh
      canal.instance.filter.regex: "mhp\\.merchant,mhp\\.user"
      canal.destinations: example
    ports:
      - "11111:11111"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
  redis-data:
  nacos-data:
  es-data:
