spring:
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yaml
  application:
    name: mhp-app
  config:
    import: nacos:mhp-app.yaml
  datasource:
    url: jdbc:mysql://localhost:3306/mhp?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: 222333dyh
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: 123456
    publisher-confirm-type: correlated
    listener:
      simple:
        acknowledge-mode: manual

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

sa-token:
  token-name: token
  timeout: 2592000
  is-concurrent: true
  is-read-cookie: false
  token-style: uuid

xxl:
  job:
    admin:
      addresses: http://localhost:8080/xxl-job-admin
      accessToken: default_token
    executor:
      appname: cosplay-executor
      ip:
      port: 9999
      logpath: ./logs/xxl-job
      logretentiondays: 30

qiniu:
  access-key: ${QINIU_ACCESS_KEY:placeholder}
  secret-key: ${QINIU_SECRET_KEY:placeholder}
  bucket: cosplay-images
  domain: cdn.your-domain.com

springdoc:
  swagger-ui:
    path: /swagger-ui.html
server:
  port: 8081
