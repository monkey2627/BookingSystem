spring:
  application:
    name: mhp-account
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yaml
  config:
    import: optional:nacos:mhp-account.yaml
  datasource:
    url: jdbc:mysql://localhost:3306/mhp?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: 222333dyh
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
  elasticsearch:
    # ES 8.x 单节点，安全认证已在 docker-compose 中关闭（xpack.security.enabled=false）
    uris: http://localhost:9200

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath:mapper/*.xml

sa-token:
  token-name: token
  timeout: 2592000
  is-concurrent: true
  is-read-cookie: false
  token-style: uuid

springdoc:
  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8081

# Canal CDC 客户端配置
# Canal server 在 docker-compose 中以 canal/canal-server:v1.1.7 运行
# destination 与 Canal server 的 canal.destinations 环境变量保持一致
canal:
  server: localhost:11111
  destination: example

dubbo:
  application:
    name: mhp-account
  protocol:
    name: tri       # Triple 协议（HTTP/2），Dubbo3 推荐，与 gRPC 互通
    port: -1        # 随机端口，避免与 Spring Boot HTTP 8081 冲突
  registry:
    address: nacos://127.0.0.1:8848
    group: DUBBO    # 独立 group，避免 Dubbo 实例混入 Spring Cloud DEFAULT_GROUP 被 Gateway 轮询
