spring:
  application:
    name: mhp-booking
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yaml
  config:
    import: optional:nacos:mhp-booking.yaml
  datasource:
    url: jdbc:mysql://localhost:3306/mhp?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: 222333dyh
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: 123456
    publisher-confirm-type: correlated

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath:mapper/*.xml

sa-token:
  token-name: token
  timeout: 2592000
  is-concurrent: true
  is-read-cookie: false
  token-style: uuid

xxl:
  job:
    admin:
      addresses: http://localhost:8088/xxl-job-admin
      accessToken: default_token
    executor:
      appname: booking-executor
      ip:
      port: 9998
      logpath: ./logs/xxl-job
      logretentiondays: 30

springdoc:
  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8082

dubbo:
  application:
    name: mhp-booking
    serialize-check-status: WARN
    metadata-type: remote   # 元数据存入 Nacos，Consumer 从 Nacos 拉取，不走 Provider 元数据端口
  metadata-report:
    address: nacos://127.0.0.1:8848
    group: DUBBO
  consumer:
    check: false            # 启动时不检查 Provider 是否在线，解除服务间启动顺序依赖
  protocol:
    name: tri       # Triple 协议（HTTP/2），Dubbo3 推荐，与 gRPC 互通
    port: -1        # 随机端口，避免与 Spring Boot HTTP 8082 冲突
    host: 10.2.0.6  # 固定注册到 Nacos 的 IP，防止选中 Docker 网桥地址 172.18.0.1
  registry:
    address: nacos://127.0.0.1:8848
    group: DUBBO    # 独立 group，避免 Dubbo 实例混入 Spring Cloud DEFAULT_GROUP 被 Gateway 轮询
