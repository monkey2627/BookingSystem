spring:
  application:
    name: mhp-booking
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yaml
  config:
    import: optional:nacos:mhp-booking.yaml
  datasource:
    url: jdbc:mysql://localhost:3306/mhp?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: 222333dyh
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: 123456
    publisher-confirm-type: correlated

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath:mapper/*.xml

sa-token:
  token-name: token
  timeout: 2592000
  is-concurrent: true
  is-read-cookie: false
  token-style: uuid

xxl:
  job:
    admin:
      addresses: http://localhost:8088/xxl-job-admin
      accessToken: default_token
    executor:
      appname: booking-executor
      ip:
      port: 9998
      logpath: ./logs/xxl-job
      logretentiondays: 30

springdoc:
  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8082

dubbo:
  application:
    name: mhp-booking
  protocol:
    name: tri
    port: -1
  registry:
    address: nacos://127.0.0.1:8848
    group: DUBBO
